apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: azurefunctionflexconsumptions.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: AzureFunctionFlexConsumption
    annotations:
      catalog.cluster.local/title: "Azure Function (Flex Consumption)"
      catalog.cluster.local/description: "Deploy an Azure Function App on the Flex Consumption plan from a ZIP package."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://learn.microsoft.com/azure/azure-functions/flex-consumption-plan"
      catalog.cluster.local/tags: "function,serverless,compute,managed,flex-consumption"
  names:
    kind: AzureFunctionFlexConsumption
    plural: azurefunctionflexconsumptions
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: Provisions an Azure Function App on the Flex Consumption plan.
          type: object
          properties:
            spec:
              description: Configuration for the Function App.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # A sibling of parameters, not a member of it: the catalog UI renders only
                # spec.parameters, so this stays declarative-only while keeping schema validation.
                packageSha256:
                  type: string
                  description: "Lowercase SHA-256 checksum used to verify the ZIP before deployment. Set declaratively; not offered in the catalog form."
                  minLength: 64
                  maxLength: 64
                  pattern: "^[a-f0-9]{64}$"
                parameters:
                  type: object
                  properties:
                    runtimeName:
                      type: string
                      description: "Language runtime for the function. Cannot be changed after creation."
                      display-name: "Runtime"
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: "Runtime cannot be changed after creation."
                      enum:
                        - "dotnet-isolated"
                        - "java"
                        - "node"
                        - "powershell"
                        - "python"
                        - "custom"
                    runtimeVersion:
                      type: string
                      description: |-
                        Runtime version for the selected runtime. Can be changed after creation.

                        Defaults per runtime:

                        - `dotnet-isolated` — 8.0
                        - `java` — 17
                        - `node` — 20
                        - `powershell` — 7.4
                        - `python` — 3.11
                        - `custom` — 1.0
                      display-name: "Runtime Version"
                    package:
                      type: string
                      format: uri
                      description: |-
                        HTTPS URL of a function ZIP in this space's GitLab Generic Package registry.
                        Change the URL to deploy a new version.

                        Example:

                        `https://gitlab.zuluplane.io/api/v4/projects/<PROJECT_ID>/packages/generic/<PACKAGE_NAME>/<VERSION>/<PACKAGE_NAME>.zip`
                      display-name: "Package URL"
                      maxLength: 2048
                      pattern: '^https://[^/?#]+/api/v4/projects/[^/?#]+/packages/generic/[^/?#]+/[^/?#]+/[^/?#]+\.zip$'
                    environmentVariables:
                      type: array
                      description: "Function App settings."
                      display-name: "Environment Variables"
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - key
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            minLength: 1
                            maxLength: 255
                            description: "Setting name containing letters, numbers, periods, or underscores."
                            pattern: "^[A-Za-z0-9._]+$"
                          value:
                            type: string
                        required:
                          - key
                          - value
                    corsAllowedOrigins:
                      type: array
                      description: "Extra browser origins allowed to call the Function App."
                      display-name: "CORS Allowed Origins"
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 2048
                        pattern: '^(\*|https?://[^/]+)$'
                    managedIdentityRoleAssignments:
                      type: array
                      title: "Managed Identity Role Assignments"
                      description: |-
                        Azure roles granted to the Function App's managed identity.

                        Role and scope are fixed once an entry exists. To change either, remove the
                        entry and add a new one under a different name.
                      maxItems: 20
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: "Name"
                            minLength: 1
                            maxLength: 32
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                            description: "Unique name for this role assignment."
                          roleDefinitionName:
                            type: string
                            title: "Role"
                            description: "Azure role to assign. Cannot be changed after creation."
                            default: "Azure Kubernetes Service Contributor Role"
                            maxLength: 128
                            pattern: "^Azure Kubernetes Service Contributor Role$"
                            x-kubernetes-validations:
                              - rule: self == oldSelf
                                message: "Role cannot be changed after creation. Remove this assignment and add a new one instead."
                          scope:
                            type: string
                            title: "Scope"
                            minLength: 1
                            maxLength: 1024
                            pattern: "^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/[^/]+/.+$"
                            description: "Azure resource ID that receives the role assignment. Cannot be changed after creation."
                            x-kubernetes-validations:
                              - rule: self == oldSelf
                                message: "Scope cannot be changed after creation. Remove this assignment and add a new one instead."
                        required:
                          - name
                          - roleDefinitionName
                          - scope
                  required:
                    - runtimeName
                    - package
              required:
                - parameters
            status:
              description: Deployment details for the Function App.
              type: object
              properties:
                functionAppName:
                  type: string
                  description: "Generated name of the Function App."
                  display-name: "Function App Name"
                deploymentContainerEndpoint:
                  type: string
                  description: "Blob container endpoint used to deploy the function ZIP."
                  display-name: "Deployment Container Endpoint"
