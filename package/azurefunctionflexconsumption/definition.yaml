apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: azurefunctionflexconsumptions.catalog.cluster.local
spec:
  group: catalog.cluster.local
  scope: Namespaced
  metadata:
    labels:
      catalog.cluster.local/kind: AzureFunctionFlexConsumption
    annotations:
      catalog.cluster.local/title: "Azure Function (Flex Consumption)"
      catalog.cluster.local/description: "Azure Functions on the Flex Consumption plan: fast, pay-per-use elastic scaling, deploying your code directly rather than a container image. This plan does not accept a container image - publish a ready-to-run package with Flex Consumption OneDeploy, for example through Azure Functions Core Tools or `az functionapp deployment source config-zip`."
      catalog.cluster.local/icon: ""
      catalog.cluster.local/maintainer: ""
      catalog.cluster.local/url: "https://learn.microsoft.com/azure/azure-functions/flex-consumption-plan"
      catalog.cluster.local/tags: "function,serverless,compute,managed,flex-consumption"
  names:
    kind: AzureFunctionFlexConsumption
    plural: azurefunctionflexconsumptions
  versions:
    - name: v2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          description: AzureFunctionFlexConsumption provisions a Flex Consumption Azure Function App and its required infrastructure.
          type: object
          properties:
            spec:
              description: AzureFunctionFlexConsumptionSpec defines the desired Function App.
              type: object
              properties:
                crossplane:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                parameters:
                  type: object
                  properties:
                    location:
                      type: string
                      description: "Azure region for the Function App and its dedicated storage account. This value cannot be changed after creation."
                      display-name: "Location"
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: "Location cannot be changed after creation."
                      enum:
                        - "Switzerland North"
                      default: "Switzerland North"
                    runtimeName:
                      type: string
                      description: "Language runtime the Function App code targets. This value cannot be changed after creation."
                      display-name: "Runtime"
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: "Runtime cannot be changed after creation."
                      enum:
                        - "dotnet-isolated"
                        - "java"
                        - "node"
                        - "powershell"
                        - "python"
                        - "custom"
                    runtimeVersion:
                      type: string
                      description: "Optional runtime version matching runtimeName. When omitted, the composition uses: 8.0 for dotnet-isolated, 17 for java, 20 for node, 7.4 for powershell, 3.11 for python, and 1.0 for custom handlers."
                      display-name: "Runtime Version"
                    environmentVariables:
                      type: array
                      description: "Non-secret environment variables exposed as Function App settings. Use external secret integration for sensitive values."
                      display-name: "Environment Variables"
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - key
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            minLength: 1
                            maxLength: 255
                            description: "Only letters, numbers, periods, and underscores are allowed - no spaces or other special characters."
                            pattern: '^[A-Za-z0-9._]+$'
                          value:
                            type: string
                        required:
                          - key
                          - value
                    managedIdentityRoleAssignments:
                      type: array
                      title: "Managed Identity Role Assignments"
                      description: "Approved Azure RBAC roles granted to the Function App's system-assigned managed identity on an existing Azure resource. Keep every scope as narrow as possible."
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: "Name"
                            minLength: 1
                            maxLength: 32
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            description: "Stable name used to identify this role assignment inside the composition."
                          roleDefinitionName:
                            type: string
                            title: "Role"
                            description: "Catalog-approved built-in Azure role."
                            default: "Azure Kubernetes Service Contributor Role"
                            pattern: '^Azure Kubernetes Service Contributor Role$'
                          scope:
                            type: string
                            title: "Scope"
                            minLength: 1
                            pattern: '^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/[^/]+/.+$'
                            description: "Full Azure resource ID to which the role is scoped."
                        required:
                          - name
                          - roleDefinitionName
                          - scope
                    keyVaultAccessPolicy:
                      type: object
                      description: "Programmatic-only read access for a legacy access-policy Key Vault. Supply keyVaultId and tenantId through YAML or the API; the catalog form intentionally hides this object."
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                    - runtimeName
              required:
                - parameters
            status:
              description: AzureFunctionFlexConsumptionStatus surfaces details needed to publish code into this Function App.
              type: object
              properties:
                functionAppName:
                  type: string
                  description: "Generated Azure Function App name used for publishing and Azure resource lookup."
                  display-name: "Function App Name"
                deploymentContainerEndpoint:
                  type: string
                  description: "Blob endpoint of the private container from which this Function App reads its code package. Publish a ready-to-run package through Flex Consumption OneDeploy, for example with Azure Functions Core Tools or `az functionapp deployment source config-zip`. Empty until the dedicated storage account and container have been created."
                  display-name: "Deployment Container Endpoint"
