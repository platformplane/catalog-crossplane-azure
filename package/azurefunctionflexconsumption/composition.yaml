apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: azurefunctionflexconsumptions.catalog.cluster.local
spec:
  compositeTypeRef:
    apiVersion: catalog.cluster.local/v2
    kind: AzureFunctionFlexConsumption

  mode: Pipeline
  pipeline:
    - step: get-environment-configs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: azure-environment

    - step: function-app
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |

            {{ $xr := .observed.composite.resource }}
            {{ $xrName := $xr.metadata.name }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $params := $xr.spec.parameters }}
            {{/* Optional access configuration must not replace or disable the catalog defaults.
                 Normalizing absent values here also keeps later range/with blocks from depending on
                 Go template's <no value> behaviour. */}}
            {{ $managedIdentityRoleAssignments := dig "managedIdentityRoleAssignments" (list) $params }}
            {{ $keyVaultAccessPolicy := dig "keyVaultAccessPolicy" (dict) $params }}
            {{ $keyVaultID := dig "keyVaultId" "" $keyVaultAccessPolicy }}
            {{ $keyVaultTenantID := dig "tenantId" "" $keyVaultAccessPolicy }}
            {{ $keyVaultIDValid := and (kindIs "string" $keyVaultID) (regexMatch "^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft.KeyVault/vaults/[^/]+$" $keyVaultID) }}
            {{ $keyVaultTenantIDValid := and (kindIs "string" $keyVaultTenantID) (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $keyVaultTenantID) }}
            {{ $environmentVariables := dig "environmentVariables" (list) $params }}
            {{ $environment := index $.context "apiextensions.crossplane.io/environment" }}

            {{/* crossplane-azure-operator only publishes flex-consumption-subnet-id once the dedicated
                 integration subnet exists in this cluster's virtual network and carries the
                 Microsoft.App/environments delegation. Leave it empty while absent and skip rendering
                 the Function App below (guarded further down where it is used) instead of failing the
                 whole pipeline step: a missing key would otherwise resolve to empty and produce a
                 Function App with no VNet integration, which cannot reach its private-endpoint-only
                 host storage. The service plan and storage account below don't need this value, so
                 they still get created on this reconcile even while it's missing.

                 This deliberately avoids sprig's `required`/`fail` functions - see
                 azurefunction/composition.yaml for why. */}}
            {{ $flexConsumptionSubnetID := dig "flex-consumption-subnet-id" "" $environment }}
            {{ $location := default "Switzerland North" (dig "location" "" $params) }}
            {{ $runtimeName := default "node" (dig "runtimeName" "" $params) }}
            {{ $runtimeDefaultVersions := dict "dotnet-isolated" "8.0" "java" "17" "node" "20" "powershell" "7.4" "python" "3.11" "custom" "1.0" }}
            {{ $runtimeVersion := default (get $runtimeDefaultVersions $runtimeName) (dig "runtimeVersion" "" $params) }}
            {{ $packageURL := dig "package" "" $params }}
            {{ $packageSHA256 := dig "packageSha256" "" $params }}
            {{/* Azure Function App names are a globally-unique DNS label (<name>.azurewebsites.net) and
                 Storage Account names are globally unique too, so naming either from the plain instance
                 name risks colliding with another cluster/namespace that reused the same friendly name.
                 Append a short hash of the immutable resource UID as a "random" postfix instead: it's
                 stable across reconciles (so the external-name / Azure resource ID computed below never
                 drifts) but effectively unique per instance. */}}
            {{ $postfix := trunc 6 (sha256sum (printf "%s" $xr.metadata.uid)) }}
            {{ $resourceLabel := $xrName }}
            {{/* App Service plan names (Microsoft.Web/serverfarms) cap out at 40 characters, and the
                 plan name below is the function name plus a "-plan" suffix, so the sanitized instance
                 name is truncated hard to leave room for both. */}}
            {{ $sanitizedXrName := trimSuffix "-" (trunc 20 (regexReplaceAll "[^a-z0-9-]" ($xrName | lower) "")) }}
            {{ $functionName := printf "fn-%s-%s" $sanitizedXrName $postfix }}
            {{/* Bump this revision whenever the deployment Job behavior changes so existing immutable
                 Jobs are replaced instead of patched. */}}
            {{ $packageDeploymentRevision := "3" }}
            {{ $packageRevision := trunc 10 (sha256sum (printf "%s:%s:%s" $packageDeploymentRevision $packageURL $packageSHA256)) }}
            {{ $packageDeploymentName := printf "%s-deploy-%s" $functionName $packageRevision }}
            {{ $packageDeploymentResourceName := printf "package-deployment-%s" $packageRevision }}
            {{/* FunctionAppFlexConsumption expects crossplane.io/external-name to contain only the
                 Azure site name. The provider combines it with the subscription and resource group
                 when constructing the Microsoft.Web/sites resource ID. */}}
            {{ $planResourceName := printf "%s-plan" $functionName }}
            {{ $storageLabel := printf "%s-storage" $xrName }}
            {{ if gt (len $storageLabel) 55 }}
            {{ $storageLabel = printf "%s-%s-storage" ($xrName | trunc 38 | trimSuffix "-") $postfix }}
            {{ end }}
            {{ $storageAccountResourceName := printf "%s-account" $storageLabel }}
            {{/* Storage Account names may contain only lowercase letters and digits (no hyphens) and
                 are capped at 24 characters - tight enough that the instance name is truncated hard to
                 leave room for the same uniqueness postfix used above. */}}
            {{ $storageAccountExternalName := printf "%s%s" (trunc 18 (regexReplaceAll "[^a-z0-9]" ($xrName | lower) "")) $postfix }}
            {{ $containerResourceName := printf "%s-deployments" $storageLabel }}
            {{ $containerName := "deployments" }}
            {{ $connectionSecretName := printf "%s-connection" $xrName }}
            {{ if gt (len $connectionSecretName) 63 }}
            {{ $connectionSecretName = printf "%s-%s-connection" ($xrName | trunc 43 | trimSuffix "-") $postfix }}
            {{ end }}
            {{ $appSettings := dict }}
            {{ range $variable := $environmentVariables }}
            {{ $_ := set $appSettings $variable.key $variable.value }}
            {{ end }}
            {{/* Azure Functions still requires AzureWebJobsStorage for host metadata on Flex
                 Consumption. Use the same dedicated account through the Function App's system identity;
                 these platform-owned settings intentionally override user-provided values. The empty
                 base setting is required by the Terraform-backed Flex Consumption provider to activate
                 the identity-based AzureWebJobsStorage settings. */}}
            {{ $_ := set $appSettings "AzureWebJobsStorage" "" }}
            {{ $_ := set $appSettings "AzureWebJobsStorage__accountName" $storageAccountExternalName }}
            {{ $_ := set $appSettings "AzureWebJobsStorage__credential" "managedidentity" }}

            {{/* Read back what was observed of our own composed resources on the previous reconcile. */}}
            {{ $account := dig "resources" "account" "resource" dict .observed }}
            {{ $accountID := dig "status" "atProvider" "id" "" $account }}
            {{ $accountBlobEndpoint := dig "status" "atProvider" "primaryBlobEndpoint" "" $account }}
            {{ $container := dig "resources" "container" "resource" dict .observed }}
            {{ $containerID := dig "status" "atProvider" "resourceManagerId" "" $container }}
            {{ $storageContainerEndpoint := "" }}
            {{ if $accountBlobEndpoint }}
            {{ $storageContainerEndpoint = printf "%s/%s" (trimSuffix "/" $accountBlobEndpoint) $containerName }}
            {{ end }}
            {{ $function := dig "resources" "function-app" "resource" dict .observed }}
            {{ $identity := dig "status" "atProvider" "identity" "" $function }}
            {{ $functionPrincipalID := "" }}
            {{ $functionReady := false }}
            {{ range $condition := dig "status" "conditions" (list) $function }}
            {{ if and (eq (dig "type" "" $condition) "Ready") (eq (dig "status" "" $condition) "True") }}
            {{ $functionReady = true }}
            {{ end }}
            {{ end }}
            {{ if kindIs "slice" $identity }}
            {{ if gt (len $identity) 0 }}
            {{ $functionPrincipalID = dig "principalId" "" (index $identity 0) }}
            {{ end }}
            {{ else if kindIs "map" $identity }}
            {{ $functionPrincipalID = dig "principalId" "" $identity }}
            {{ end }}
            {{ $blobRoleAssignment := dig "resources" "role-assignment-blob" "resource" dict .observed }}
            {{ $blobRoleAssignmentReady := false }}
            {{ range $condition := dig "status" "conditions" (list) $blobRoleAssignment }}
            {{ if and (eq (dig "type" "" $condition) "Ready") (eq (dig "status" "" $condition) "True") }}
            {{ $blobRoleAssignmentReady = true }}
            {{ end }}
            {{ end }}
            {{ $packageDeployment := dig "resources" $packageDeploymentResourceName "resource" dict .observed }}
            {{ $packageDeployed := and (eq (dig "metadata" "name" "" $packageDeployment) $packageDeploymentName) (gt (int (dig "status" "succeeded" 0 $packageDeployment)) 0) }}

            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: ServicePlan
            metadata:
              name: {{ $planResourceName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service-plan
                crossplane.io/external-name: {{ $functionName }}-plan
              labels:
                catalog.cluster.local/azure-function: {{ $resourceLabel }}
            spec:
              forProvider:
                location: {{ $location | quote }}
                osType: Linux
                resourceGroupName: {{ index $.context "apiextensions.crossplane.io/environment" "resourcegroup" }}
                skuName: FC1
                tags:
                  source: crossplane
                  xr-name: {{ $xrName }}
                  xr-namespace: {{ $namespace }}
                  composite: {{ $xr.metadata.uid }}

            ---
            # Dedicated, private storage account holding Function host metadata and the deployment
            # package container. It is not a catalog resource: nothing outside this composition ever
            # needs to reference it, so it is composed directly here rather than through the
            # AzureStorageV2 catalog item, keeping its resolved ID and blob endpoint available to this
            # same pipeline without needing a cross-composition resource lookup.
            apiVersion: storage.azure.m.upbound.io/v1beta1
            kind: Account
            metadata:
              name: {{ $storageAccountResourceName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: account
                crossplane.io/external-name: {{ $storageAccountExternalName }}
              labels:
                catalog.cluster.local/azure-storage: {{ $storageLabel }}
                catalog.cluster.local/function-host-storage: "true"
            spec:
              forProvider:
                resourceGroupName: {{ index $.context "apiextensions.crossplane.io/environment" "resourcegroup" }}
                location: {{ $location | quote }}
                accountReplicationType: LRS
                accountTier: Standard
                publicNetworkAccessEnabled: false
                allowNestedItemsToBePublic: false
                tags:
                  source: crossplane
                  xr-name: {{ $xrName }}
                  xr-namespace: {{ $namespace }}
                  composite: {{ $xr.metadata.uid }}

            {{/* These functions need Blob storage both for the Flex deployment package and for
                 AzureWebJobsStorage host metadata. Queue and Table private endpoints are unnecessary
                 for the HTTP and timer triggers currently deployed through this catalog item. */}}
            ---
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: PrivateEndpoint
            metadata:
              name: {{ $storageLabel }}-blob
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: endpointblob
                crossplane.io/external-name: {{ $storageLabel }}-blob
            spec:
              forProvider:
                resourceGroupName: {{ index $.context "apiextensions.crossplane.io/environment" "resourcegroup" }}
                subnetId: "/subscriptions/{{ index $.context "apiextensions.crossplane.io/environment" "network-subscription" }}/resourceGroups/{{ index $.context "apiextensions.crossplane.io/environment" "network-resourcegroup" }}/providers/Microsoft.Network/virtualNetworks/{{ index $.context "apiextensions.crossplane.io/environment" "network-name" }}/subnets/default"
                location: {{ index $.context "apiextensions.crossplane.io/environment" "network-location" }} # needs to be the same region as the network
                customNetworkInterfaceName: {{ $storageLabel }}-blob-nic
                privateServiceConnection:
                  isManualConnection: false
                  name: {{ $storageLabel }}-blob
                  privateConnectionResourceId: {{ dig "status" "atProvider" "id" "" $account | quote }}
                  subresourceNames:
                    - blob
                privateDnsZoneGroup:
                  name: default
                  privateDnsZoneIds:
                    - "/subscriptions/{{ index $.context "apiextensions.crossplane.io/environment" "network-subscription" }}/resourceGroups/{{ index $.context "apiextensions.crossplane.io/environment" "network-resourcegroup" }}/providers/Microsoft.Network/privateDnsZones/privatelink.blob.core.windows.net"
                tags:
                  source: crossplane
                  xr-name: {{ $xrName }}
                  xr-namespace: {{ $namespace }}
                  composite: {{ $xr.metadata.uid }}

            ---
            apiVersion: storage.azure.m.upbound.io/v1beta1
            kind: Container
            metadata:
              name: {{ $containerResourceName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: container
                crossplane.io/external-name: {{ $containerName }}
            spec:
              forProvider:
                containerAccessType: private
                storageAccountNameSelector:
                  matchLabels:
                    catalog.cluster.local/azure-storage: {{ $storageLabel }}
                    catalog.cluster.local/function-host-storage: "true"
                  namespace: {{ $namespace }}

            {{/* Surface the generated Azure app name and where to publish code, so
                 whoever/whatever deploys this Function App (func core tools, the Azure/functions-action
                 GitHub Action, az cli, ...) doesn't have to reconstruct it by hand. This document has no
                 gotemplating.fn.crossplane.io/composition-resource-name annotation and matches the XR's
                 own apiVersion/kind, so function-go-templating patches the composite's status with it
                 instead of composing a resource. */}}
            ---
            apiVersion: catalog.cluster.local/v2
            kind: AzureFunctionFlexConsumption
            {{ if or (not $flexConsumptionSubnetID) (and $packageURL (not $packageDeployed)) }}
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: "False"
            {{ end }}
            status:
              functionAppName: {{ $functionName | quote }}
            {{ if $storageContainerEndpoint }}
              deploymentContainerEndpoint: {{ $storageContainerEndpoint | quote }}
            {{ end }}

            {{/* Wait for both the Flex Consumption integration subnet and the deployment container's
                 resolved blob endpoint before creating the Function App itself: without the subnet
                 there is no virtualNetworkSubnetId, and without the endpoint there is nowhere for it
                 to load its code from. The service plan, storage account, and container above don't
                 need either and are created regardless. */}}
            {{ if and $flexConsumptionSubnetID $storageContainerEndpoint $containerID }}
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: FunctionAppFlexConsumption
            metadata:
              name: {{ $xrName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: function-app
                crossplane.io/external-name: {{ $functionName }}
            spec:
              forProvider:
                appSettings:
            {{ $appSettings | toYaml | nindent 18 }}
                # Work around provider-azure-web Observe panics when Azure returns no
                # Authentication / Authorization configuration for the Function App.
                authSettings:
                  enabled: false
                httpsOnly: true
                identity:
                  type: SystemAssigned
                instanceMemoryInMb: 2048
                maximumInstanceCount: 40
                location: {{ $location | quote }}
                publicNetworkAccessEnabled: true
                resourceGroupName: {{ index $.context "apiextensions.crossplane.io/environment" "resourcegroup" }}
                runtimeName: {{ $runtimeName | quote }}
                runtimeVersion: {{ $runtimeVersion | quote }}
                servicePlanIdSelector:
                  matchLabels:
                    catalog.cluster.local/azure-function: {{ $resourceLabel }}
                siteConfig:
                  http2Enabled: true
                  minimumTlsVersion: "1.2"
                  vnetRouteAllEnabled: true
                storageAuthenticationType: SystemAssignedIdentity
                storageContainerType: blobContainer
                storageContainerEndpoint: {{ $storageContainerEndpoint | quote }}
                tags:
                  source: crossplane
                  xr-name: {{ $xrName }}
                  xr-namespace: {{ $namespace }}
                  composite: {{ $xr.metadata.uid }}
                webdeployPublishBasicAuthenticationEnabled: false
                virtualNetworkSubnetId: {{ $flexConsumptionSubnetID | quote }}

            {{/*
              The Function App's system-assigned identity only becomes known once it has been observed
              at least once, so this grant renders starting on a later reconcile, not the first one. It
              is scoped to this Function's dedicated account so AzureWebJobsStorage can create and use
              its host-metadata containers as well as read the deployment package. Nothing outside this
              Function uses the account, and the role cannot manage access itself.
            */}}
            {{ if and $functionPrincipalID $accountID }}
            ---
            apiVersion: authorization.azure.m.upbound.io/v1beta1
            kind: RoleAssignment
            metadata:
              name: {{ $storageLabel }}-role-blob
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role-assignment-blob
            spec:
              forProvider:
                scope: {{ $accountID | quote }}
                roleDefinitionName: "Storage Blob Data Owner"
                principalId: {{ $functionPrincipalID | quote }}
                principalType: ServicePrincipal
                skipServicePrincipalAadCheck: true
            {{ end }}

            {{/* Optional access to existing Azure resources is deliberately restricted by the XRD to
                 catalog-approved built-in roles. Rendering only after the Function identity is observed
                 avoids an imperative wait loop and keeps the role assignment under Crossplane ownership. */}}
            {{ if $functionPrincipalID }}
            {{ range $assignment := $managedIdentityRoleAssignments }}
            {{ $assignmentResourceName := printf "%s-role-%s" $xrName $assignment.name }}
            {{ if gt (len $assignmentResourceName) 63 }}
            {{ $assignmentResourceName = printf "%s-%s-%s" (trunc 20 $xrName | trimSuffix "-") (trunc 29 $assignment.name | trimSuffix "-") $postfix }}
            {{ end }}
            ---
            apiVersion: authorization.azure.m.upbound.io/v1beta1
            kind: RoleAssignment
            metadata:
              name: {{ $assignmentResourceName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role-assignment-{{ $assignment.name }}
            spec:
              forProvider:
                scope: {{ $assignment.scope | quote }}
                roleDefinitionName: {{ default "Azure Kubernetes Service Contributor Role" (dig "roleDefinitionName" "" $assignment) | quote }}
                principalId: {{ $functionPrincipalID | quote }}
                principalType: ServicePrincipal
                skipServicePrincipalAadCheck: true
            {{ end }}

            {{/* ZuluPlane's existing Key Vault uses legacy access policies. Keep this separate from
                 Azure RBAC role assignments and grant only the one permission App Service Key Vault
                 references require: Get. */}}
            {{ if and $keyVaultIDValid $keyVaultTenantIDValid }}
            {{ $keyVaultPolicyResourceName := printf "%s-key-vault" $xrName }}
            {{ if gt (len $keyVaultPolicyResourceName) 63 }}
            {{ $keyVaultPolicyResourceName = printf "%s-%s-key-vault" (trunc 40 $xrName | trimSuffix "-") $postfix }}
            {{ end }}
            ---
            apiVersion: keyvault.azure.m.upbound.io/v1beta1
            kind: AccessPolicy
            metadata:
              name: {{ $keyVaultPolicyResourceName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: key-vault-access-policy
            spec:
              forProvider:
                keyVaultId: {{ $keyVaultID | quote }}
                objectId: {{ $functionPrincipalID | quote }}
                tenantId: {{ $keyVaultTenantID | quote }}
                secretPermissions:
                  - Get
            {{ end }}
            {{ end }}
            {{ end }}

            {{/* A package is deployed only after the Function App and its host-storage access are ready.
                 The Job reads the registry credentials distributed to every node by registry-operator and
                 uses the node pool's existing Azure managed identity. Azure CLI owns OneDeploy and polling. */}}
            {{ if and $packageURL $packageSHA256 $functionReady $blobRoleAssignmentReady }}
            ---
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $packageDeploymentName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $packageDeploymentResourceName }}
            {{ if $packageDeployed }}
                gotemplating.fn.crossplane.io/ready: "True"
            {{ end }}
              labels:
                app.kubernetes.io/name: azure-function-package-deployment
                catalog.cluster.local/azure-function: {{ $resourceLabel }}
            spec:
              backoffLimit: 3
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: azure-function-package-deployment
                    catalog.cluster.local/azure-function: {{ $resourceLabel }}
                spec:
                  restartPolicy: Never
                  containers:
                    - name: deploy
                      image: mcr.microsoft.com/azure-cli:2.77.0@sha256:d41153958a61392a4c9db1591e33b533ca8ab8b59529d212d06bb6ec7e9c1f25
                      imagePullPolicy: IfNotPresent
                      command:
                        - /bin/bash
                        - -ceu
                        - |
                          python3 - <<'PY'
                          import base64
                          import hashlib
                          import json
                          import os
                          import urllib.parse
                          import urllib.request
                          import zipfile

                          package_url = os.environ["PACKAGE_URL"]
                          expected_sha256 = os.environ["PACKAGE_SHA256"]
                          package_path = "/tmp/function.zip"

                          with open("/var/run/platformplane-registry/config.json", encoding="utf-8") as config_file:
                              registries = json.load(config_file).get("auths", {})

                          package_url_parts = urllib.parse.urlsplit(package_url)
                          if (
                              package_url_parts.scheme != "https"
                              or package_url_parts.username
                              or package_url_parts.password
                              or package_url_parts.query
                              or package_url_parts.fragment
                          ):
                              raise RuntimeError("package URL must be an HTTPS URL without credentials or parameters")

                          matching_credentials = []
                          for registry, credential in registries.items():
                              registry_url = urllib.parse.urlsplit(
                                  registry if "://" in registry else "https://" + registry
                              )
                              if registry_url.scheme != "https" or not registry_url.hostname:
                                  continue
                              if not registry_url.hostname.startswith("registry."):
                                  continue
                              gitlab_host = "gitlab." + registry_url.hostname.removeprefix("registry.")
                              if (
                                  package_url_parts.hostname == gitlab_host
                                  and package_url_parts.port == registry_url.port
                              ):
                                  matching_credentials.append(credential)
                          if len(matching_credentials) != 1:
                              raise RuntimeError("node registry config has no unique credential for the GitLab package host")
                          credential = matching_credentials[0]

                          token = credential.get("password", "")
                          if not token and credential.get("auth"):
                              token = base64.b64decode(credential["auth"]).decode().partition(":")[2]
                          if not token:
                              raise RuntimeError("GitLab registry token is missing")

                          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
                              def redirect_request(self, request, *args, **kwargs):
                                  redirected = super().redirect_request(request, *args, **kwargs)
                                  if redirected and redirected.host != request.host:
                                      redirected.remove_header("PRIVATE-TOKEN")
                                  return redirected

                          request = urllib.request.Request(package_url, headers={"PRIVATE-TOKEN": token})
                          digest = hashlib.sha256()
                          size = 0
                          with urllib.request.build_opener(SafeRedirectHandler()).open(request, timeout=60) as response:
                              with open(package_path, "wb") as package_file:
                                  while chunk := response.read(1024 * 1024):
                                      size += len(chunk)
                                      if size > 1024 * 1024 * 1024:
                                          raise RuntimeError("package exceeds 1 GiB")
                                      digest.update(chunk)
                                      package_file.write(chunk)

                          actual_sha256 = digest.hexdigest()
                          if actual_sha256 != expected_sha256:
                              raise RuntimeError(
                                  f"package SHA-256 is {actual_sha256}, expected {expected_sha256}"
                              )
                          with zipfile.ZipFile(package_path) as archive:
                              if "host.json" not in archive.namelist() or archive.getinfo("host.json").is_dir():
                                  raise RuntimeError("deployment ZIP must contain host.json at its root")
                          PY

                          az login --identity --output none
                          az functionapp deployment source config-zip \
                            --subscription "$AZURE_SUBSCRIPTION_ID" \
                            --resource-group "$AZURE_RESOURCE_GROUP" \
                            --name "$FUNCTION_APP_NAME" \
                            --src /tmp/function.zip \
                            --timeout 600 \
                            --only-show-errors \
                            --output none
                      env:
                        - name: PACKAGE_URL
                          value: {{ $packageURL | quote }}
                        - name: PACKAGE_SHA256
                          value: {{ $packageSHA256 | quote }}
                        - name: AZURE_SUBSCRIPTION_ID
                          value: {{ index $environment "subscription" | quote }}
                        - name: AZURE_RESOURCE_GROUP
                          value: {{ index $environment "resourcegroup" | quote }}
                        - name: FUNCTION_APP_NAME
                          value: {{ $functionName | quote }}
                      volumeMounts:
                        - name: node-registry
                          mountPath: /var/run/platformplane-registry/config.json
                          readOnly: true
                  volumes:
                    - name: node-registry
                      hostPath:
                        path: /.docker/config.json
                        type: File
            {{ end }}

            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $connectionSecretName }}
              namespace: {{ $namespace }}
              annotations:
                {{ setResourceNameAnnotation "connection-secret" }}
            type: Opaque
            {{ $hostname := dig "status" "atProvider" "defaultHostname" "" $function }}
            {{ if $hostname }}
            data:
            {{ if $packageURL }}
              deployment-note: {{ printf "The catalog deploys %s automatically through Flex Consumption OneDeploy" $packageURL | b64enc }}
              package: {{ $packageURL | b64enc }}
              package-sha256: {{ $packageSHA256 | b64enc }}
            {{ else }}
              deployment-note: {{ printf "Run from your Function project directory: func azure functionapp publish %s" $functionName | b64enc }}
            {{ end }}
              host: {{ $hostname | b64enc }}
              name: {{ $functionName | b64enc }}
              url: {{ printf "https://%s" $hostname | b64enc }}
            {{ else }}
            data: {}
            {{ end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready

    - step: enforce-creation-sequence
      functionRef:
        name: crossplane-contrib-function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        rules:
          - sequence:
              - "service-plan"
              - "function-app"
          - sequence:
              - "account"
              - "endpointblob"
          - sequence:
              - "account"
              - "container"
          - sequence:
              - "container"
              - "function-app"
          - sequence:
              - "container"
              - "role-assignment-blob"
          - sequence:
              - "function-app"
              - "role-assignment-blob"
