apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: functionnetworks.azure.platformplane.io
spec:
  compositeTypeRef:
    apiVersion: azure.platformplane.io/v1alpha1
    kind: FunctionNetwork

  mode: Pipeline
  pipeline:
    - step: function-integration-subnets
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $xr := .observed.composite.resource }}
            {{ $namespace := $xr.metadata.namespace }}
            {{ $parameters := $xr.spec.parameters }}

            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: Subnet
            metadata:
              name: azure-functions-app-service
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-service-subnet
                crossplane.io/external-name: app-service
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              forProvider:
                addressPrefixes:
                  - {{ $parameters.appServiceAddressPrefix | quote }}
                resourceGroupName: {{ $parameters.resourceGroupName | quote }}
                virtualNetworkName: {{ $parameters.virtualNetworkName | quote }}
                delegation:
                  - name: app-service-delegation
                    serviceDelegation:
                      name: Microsoft.Web/serverFarms

            ---
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: Subnet
            metadata:
              name: azure-functions-flex-consumption
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: flex-consumption-subnet
                crossplane.io/external-name: flex-consumption
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              forProvider:
                addressPrefixes:
                  - {{ $parameters.flexConsumptionAddressPrefix | quote }}
                resourceGroupName: {{ $parameters.resourceGroupName | quote }}
                virtualNetworkName: {{ $parameters.virtualNetworkName | quote }}
                delegation:
                  - name: flex-consumption-delegation
                    serviceDelegation:
                      name: Microsoft.App/environments

            {{ $subnetIds := dict "appServiceSubnetId" "" "flexConsumptionSubnetId" "" }}
            {{ range $statusField, $resourceName := dict "appServiceSubnetId" "app-service-subnet" "flexConsumptionSubnetId" "flex-consumption-subnet" }}
            {{ $subnet := dig "resources" $resourceName "resource" dict .observed }}
            {{ $subnetReady := false }}
            {{ range $condition := dig "status" "conditions" list $subnet }}
            {{ if and (eq (dig "type" "" $condition) "Ready") (eq (dig "status" "" $condition) "True") }}
            {{ $subnetReady = true }}
            {{ end }}
            {{ end }}
            {{ if $subnetReady }}
            {{ $_ := set $subnetIds $statusField (dig "status" "atProvider" "id" "" $subnet) }}
            {{ end }}
            {{ end }}

            ---
            apiVersion: azure.platformplane.io/v1alpha1
            kind: FunctionNetwork
            status:
              appServiceSubnetId: {{ get $subnetIds "appServiceSubnetId" | quote }}
              flexConsumptionSubnetId: {{ get $subnetIds "flexConsumptionSubnetId" | quote }}

    - step: automatically-detect-readiness
      functionRef:
        name: crossplane-contrib-function-auto-ready
